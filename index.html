<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Math — Markdown Editor</title>
  </head>
  <body>
    <header class="app-header">
      <span class="app-title">Quick Math</span>
      <span class="app-hint">
        Type math inside <code>$ … $</code> or <code>$$ … $$</code>. Try
        <code>x/</code>, <code>sqx</code>, <code>@a</code>, <code>//</code>, <code>dm</code>.
      </span>
      <div class="app-actions">
        <button
          id="btn-sync"
          class="btn"
          type="button"
          title="Toggle synchronized scrolling"
          aria-pressed="false"
        >
          ⇅ Sync scroll
        </button>
        <div class="dropdown">
          <button
            id="btn-export"
            class="btn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Export ▾
          </button>
          <div id="export-menu" class="dropdown-menu" role="menu" hidden>
            <button
              class="dropdown-item"
              type="button"
              role="menuitem"
              data-export="pdf"
            >
              PDF
            </button>
            <button
              class="dropdown-item"
              type="button"
              role="menuitem"
              data-export="md"
            >
              Raw .md file
            </button>
          </div>
        </div>
        <button id="btn-copy" class="btn" type="button">Copy .md</button>
        <div class="seg">
          <div class="dropdown seg-cell">
            <button
              id="btn-theme"
              class="seg-btn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Theme ▾
            </button>
            <div id="theme-menu" class="dropdown-menu" role="menu" hidden></div>
          </div>
          <button
            id="btn-mode"
            class="seg-btn seg-mode"
            type="button"
            title="Toggle light / dark mode"
            aria-label="Toggle light / dark mode"
          >
            🌙
          </button>
        </div>
      </div>
    </header>
    <main class="panes">
      <section class="pane pane-editor">
        <div id="editor"></div>
      </section>
      <section class="pane pane-preview">
        <div id="preview" class="markdown-preview"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
