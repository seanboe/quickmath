<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaTeX Suite — Markdown Editor</title>
  </head>
  <body>
    <header class="app-header">
      <span class="app-title">LaTeX Suite</span>
      <span class="app-hint">
        Type math inside <code>$ … $</code> or <code>$$ … $$</code>. Try
        <code>x/</code>, <code>sqx</code>, <code>@a</code>, <code>//</code>, <code>dm</code>.
      </span>
    </header>
    <main class="panes">
      <section class="pane pane-editor">
        <div id="editor"></div>
      </section>
      <section class="pane pane-preview">
        <div id="preview" class="markdown-preview"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
