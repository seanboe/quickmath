<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Math — Markdown Editor</title>
  </head>
  <body>
    <header class="app-header">
      <span class="app-title">Quick Math</span>
      <span class="app-hint">
        Type math inside <code>$ … $</code> or <code>$$ … $$</code>. Try
        <code>x/</code>, <code>sqx</code>, <code>@a</code>, <code>//</code>, <code>dm</code>.
      </span>
      <div class="app-actions">
        <button
          id="btn-sync"
          class="btn"
          type="button"
          title="Toggle synchronized scrolling"
          aria-pressed="false"
        >
          ⇅ Sync scroll
        </button>
        <button id="btn-save" class="btn" type="button">Save .md</button>
        <button id="btn-pdf" class="btn" type="button">Export PDF</button>
        <button
          id="btn-theme"
          class="btn btn-icon"
          type="button"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>
      </div>
    </header>
    <main class="panes">
      <section class="pane pane-editor">
        <div id="editor"></div>
      </section>
      <section class="pane pane-preview">
        <div id="preview" class="markdown-preview"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
